services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: englishwebai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-englishwebai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-englishwebai123}
      POSTGRES_DB: ${DB_NAME:-englishwebai_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - englishwebai_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-englishwebai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: englishwebai_backend
    restart: unless-stopped
    environment:
      # Application
      APP_NAME: EnglishWebAI
      APP_VERSION: 1.0.0
      DEBUG: ${DEBUG:-False}
      API_PREFIX: /api/v1
      
      # Server
      HOST: 0.0.0.0
      PORT: 8000
      
      # Database
      DATABASE_URL: postgresql://${DB_USER:-englishwebai}:${DB_PASSWORD:-englishwebai123}@postgres:5432/${DB_NAME:-englishwebai_db}
      
      # Security
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      
      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost}
      ALLOWED_METHODS: GET,POST,PUT,DELETE,PATCH
      ALLOWED_HEADERS: "*"
    volumes:
      - ./backend:/app
      - backend_static:/app/static
      - backend_media:/app/media
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - englishwebai_network
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        echo 'Running migrations...' &&
        alembic upgrade head &&
        echo 'Starting server...' &&
        uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      "

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: englishwebai_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - englishwebai_network
    depends_on:
      - backend

  # Redis (Optional - for caching)
  redis:
    image: redis:7-alpine
    container_name: englishwebai_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - englishwebai_network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # PgAdmin (Optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: englishwebai_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@englishwebai.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - englishwebai_network
    depends_on:
      - postgres
    profiles:
      - dev

networks:
  englishwebai_network:
    driver: bridge
    name: englishwebai_network

volumes:
  postgres_data:
    name: englishwebai_postgres_data
  redis_data:
    name: englishwebai_redis_data
  pgadmin_data:
    name: englishwebai_pgadmin_data
  backend_static:
    name: englishwebai_backend_static
  backend_media:
    name: englishwebai_backend_media
