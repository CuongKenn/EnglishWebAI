services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: englishwebai_backend
    restart: unless-stopped
    environment:
      # Application
      APP_NAME: EnglishWebAI
      APP_VERSION: 1.0.0
      DEBUG: ${DEBUG:-True}
      API_PREFIX: /api/v1
      
      # Server
      HOST: 0.0.0.0
      PORT: 8000
      
      # Security
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    volumes:
      - ./backend:/app
      - backend_data:/app/data
      - backend_static:/app/static
      - backend_media:/app/media
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - englishwebai_network
    # Use startup script instead of direct command
    # The Dockerfile CMD will handle startup now

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: englishwebai_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - englishwebai_network
    depends_on:
      - backend

networks:
  englishwebai_network:
    driver: bridge
    name: englishwebai_network

volumes:
  backend_data:
    name: englishwebai_backend_data
  backend_static:
    name: englishwebai_backend_static
  backend_media:
    name: englishwebai_backend_media
